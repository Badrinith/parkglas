name: Refresh map data

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the new snapshot
        run: |
          mkdir -p site
          python3 Tools/build_snapshot.py --strict --out site/snapshot.json
      - name: Fetch the currently published snapshot
        run: curl --retry 3 -fsS -o old.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/snapshot.json" || true
      - name: Check the new snapshot
        run: |
          if [ -s old.json ]; then
            python3 Tools/check_snapshot.py site/snapshot.json old.json
          else
            echo "No published snapshot found; drop check skipped, floors only."
            python3 Tools/check_snapshot.py site/snapshot.json
          fi
      - name: Add the website (landing, support and privacy pages)
        run: cp -R web/. site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
